<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Civilization Incremental</title>
    <script type="module" crossorigin src="./assets/index-Dmof1_T9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DTAaAawS.css">
  </head>
  <body>
    <!-- The key numbers and the tabs stay at the top while a page scrolls;
         on phones the tabs sit at the bottom instead. -->
    <div class="top">
      <header class="top-bar" id="topBar"></header>
      <nav class="tab-bar" id="tabBar" aria-label="Pages"></nav>
    </div>
    <main id="app">
      <h1>Civilization Incremental</h1>
      <!-- These show above every page, so nothing is missed. -->
      <div id="welcome"></div>
      <div id="event"></div>
      <div id="offer"></div>
      <div id="result"></div>
      <!-- The "Age Advanced!" banner shows on every page, the Era card with
           the living scene on Home only. -->
      <div id="era"></div>

      <section class="page" data-page="home" aria-label="Home">
        <div class="panel" id="resources"></div>
      </section>
      <section
        class="page page-columns build-page"
        data-page="build"
        aria-label="Build"
        hidden
      >
        <div class="panel" id="buildings"></div>
        <div class="stack">
          <div class="panel" id="construction"></div>
          <div class="panel" id="research"></div>
        </div>
      </section>
      <section
        class="page page-columns"
        data-page="war"
        aria-label="War"
        hidden
      >
        <div class="panel" id="military"></div>
        <div class="panel" id="rivals"></div>
      </section>
      <section class="page" data-page="history" aria-label="History" hidden>
        <div class="panel" id="civilization"></div>
        <div class="panel" id="chronicle"></div>
      </section>
      <section class="page" data-page="settings" aria-label="Settings" hidden>
        <div id="options"></div>
        <div id="testTools"></div>
      </section>
    </main>
    <div id="toast"></div>
  </body>
</html>
